name: Build and Release Multi-Platform

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # --- 任务 1: 编译 Windows 通用版 (32 位) ---
  # 为什么用 Go 1.10.8：Go 1.11 起最低要求 Windows 7，Go 1.21 起要求 Windows 10。
  # 只有 Go 1.10.8 编出来的 exe 子系统版本是 4.0，XP 才肯加载；
  # 同一个 exe 在 Win7/10/11 上通过 WoW64 照常运行，所以 Windows 只发这一个包。
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.10.8'
          check-latest: false

      - name: Build Windows (XP compatible)
        # 脚本固定了 GOARCH=386 / CGO_ENABLED=0，并在编译后用 verify-xp-exe.ps1
        # 校验 PE（位数、子系统版本、导入表），任何一项不满足都会让任务失败。
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File build-xp.ps1 -Output screen-tester-windows.exe

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-bin
          path: screen-tester-windows.exe

  # --- 任务 2: 编译 Ubuntu 20.04 兼容的 Linux (64 位) ---
  build-linux:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:20.04
    steps:
      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates \
            curl \
            git \
            build-essential \
            libgl1-mesa-dev \
            xorg-dev \
            libasound2-dev \
            upx-ucl
          update-ca-certificates

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21.13'

      - name: Build and Compress Linux Binary
        run: |
          export GOTOOLCHAIN=local
          export GOOS=linux
          export GOARCH=amd64
          export CGO_ENABLED=1
          go mod download
          go build -ldflags="-s -w" -o screen-tester-linux-x64 main.go keepawake_other.go
          upx --best screen-tester-linux-x64

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-bin
          path: screen-tester-linux-x64

  # --- 任务 3: 统一发布到 Release ---
  release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Screen Tester (Windows & Linux)"
          body: |
            ## 下载说明
            - **Windows（XP / 2003 / 7 / 10 / 11，32 位）**: 请下载 `screen-tester-windows.exe`
            - **Linux (Ubuntu 20.04+)**: 请下载 `screen-tester-linux-x64`
          files: |
            windows-bin/screen-tester-windows.exe
            linux-bin/screen-tester-linux-x64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
