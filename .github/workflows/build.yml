name: Build and Release Multi-Platform

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # --- 任务 1: 编译 Windows 通用版 (32 位) ---
  # 为什么用 Go 1.10.8：Go 1.11 起最低要求 Windows 7，Go 1.21 起要求 Windows 10。
  # 只有 Go 1.10.8 编出来的 exe 子系统版本是 4.0，XP 才肯加载；
  # 同一个 exe 在 Win7/10/11 上通过 WoW64 照常运行，所以 Windows 只发这一个包。
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.10.8'
          check-latest: false

      - name: Build Windows (XP compatible)
        # 脚本固定了 GOARCH=386 / CGO_ENABLED=0，并在编译后用 verify-xp-exe.ps1
        # 校验 PE（位数、子系统版本、导入表），任何一项不满足都会让任务失败。
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File build-xp.ps1 -Output screen-tester-windows.exe

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-bin
          path: screen-tester-windows.exe

  # --- 任务 2: 编译 Linux (64 位) ---
  # 关键点：在 ubuntu:16.04 容器里编译，而不是直接在 runner 上编。
  # 产物要求的 glibc 版本由编译环境决定，用老环境编出来的能跑的发行版更多：
  # 同样一份代码，在 20.04 里编要求 GLIBC_2.31，在 16.04 里编只要求 GLIBC_2.14。
  # （不要在 job 上用 container:，老镜像里的 glibc 跑不动 runner 注入的 node。）
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare Go toolchain
        run: |
          curl -fsSL -o /tmp/go.tgz https://go.dev/dl/go1.21.13.linux-amd64.tar.gz
          tar -C /tmp -xzf /tmp/go.tgz
          mkdir -p /tmp/gopath
          GOTOOLCHAIN=local GOPATH=/tmp/gopath /tmp/go/bin/go version

      - name: Build in glibc 2.23 container (Ubuntu 16.04)
        run: |
          docker run --rm \
            -v "$PWD:/src" \
            -v /tmp/go:/usr/local/go:ro \
            -v /tmp/gopath:/gopath \
            -e GOTOOLCHAIN=local -e GOPATH=/gopath \
            -e CGO_ENABLED=1 -e GOOS=linux -e GOARCH=amd64 \
            -w /src ubuntu:16.04 bash /src/build-linux.sh

      - name: Verify glibc baseline
        run: bash verify-linux-bin.sh screen-tester-linux-x64

      - name: Compress with UPX
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq upx-ucl
          upx --best screen-tester-linux-x64

      - name: Smoke test on Ubuntu 14.04 (glibc 2.19)
        # UPX 之后 section header 没了，readelf 查不了符号版本，所以直接拿最终产物实跑：
        # 只要它能在 2014 年的发行版里加载起来（走到 X11 初始化、因为没显示器而报错），
        # 就说明 glibc 兼容性没问题。出现 GLIBC_ 版本错误则直接失败。
        run: |
          docker run --rm -v "$PWD:/src" -w /src ubuntu:14.04 bash -c '
            set -e
            export DEBIAN_FRONTEND=noninteractive
            apt-get -o Acquire::Check-Valid-Until=false update -qq
            apt-get install -y -qq --no-install-recommends --allow-unauthenticated \
              libx11-6 libgl1-mesa-glx libasound2 >/dev/null
            chmod +x ./screen-tester-linux-x64
            set +e
            timeout 20 ./screen-tester-linux-x64 > smoke.log 2>&1
            echo "退出码: $?"
            cat smoke.log
            set -e
            if grep -q "GLIBC_" smoke.log; then
              echo "[FAIL] 产物要求的 glibc 高于 Ubuntu 14.04"
              exit 1
            fi
            if ! grep -qiE "X11|Xauthority|display" smoke.log; then
              echo "[FAIL] 没走到 X11 初始化，产物可能没正常运行"
              exit 1
            fi
            echo "[OK] 在 Ubuntu 14.04 上能正常加载并启动"
          '

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-bin
          path: screen-tester-linux-x64

  # --- 任务 3: 统一发布到 Release ---
  release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Prune stale release assets
        # Release 是覆盖式更新的，旧文件名不会自动消失，这里把不在清单里的资产删掉。
        # 注意：release 任务没有 checkout，gh 必须显式指定 --repo。
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          keep="screen-tester-windows.exe screen-tester-linux-x64"
          gh release view latest --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | while read -r name; do
            if ! echo "$keep" | grep -qw "$name"; then
              echo "removing stale asset: $name"
              gh release delete-asset latest "$name" --repo "$GITHUB_REPOSITORY" --yes
            fi
          done

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Screen Tester (Windows & Linux)"
          body: |
            ## 下载说明
            - **Windows（XP / 2003 / 7 / 10 / 11，32 位）**: 请下载 `screen-tester-windows.exe`
            - **Linux（Ubuntu 12.04+ / Debian 8+ / CentOS 7+ 等，64 位）**: 请下载 `screen-tester-linux-x64`
          files: |
            windows-bin/screen-tester-windows.exe
            linux-bin/screen-tester-linux-x64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
